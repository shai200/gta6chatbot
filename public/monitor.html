<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cache Monitor — Leonida Intel</title>
  <style>
    :root { --bg:#14061f; --panel:#1f0d31; --line:rgba(255,255,255,.1); --text:#fdf3ff; --muted:#bfa6d1; --pink:#ff3d9a; --orange:#ff8a3d; --teal:#3ee6d0; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif; padding:24px 16px 48px; }
    .wrap { max-width:1100px; margin:0 auto; }
    header { display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 16px; margin-bottom:20px; }
    h1 { font-size:22px; margin:0; }
    h1 span { color:var(--pink); }
    .meta { color:var(--muted); font-size:13px; }
    .live { margin-left:auto; font-size:13px; color:var(--teal); }
    .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px; }
    .tile { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
    .tile .k { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
    .tile .v { font-size:28px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; }
    .tile .s { font-size:12px; color:var(--muted); }
    .bar { height:10px; border-radius:6px; background:rgba(255,255,255,.08); overflow:hidden; margin:0 0 20px; display:flex; }
    .bar i { display:block; height:100%; }
    .bar .h { background:var(--teal); } .bar .m { background:var(--orange); } .bar .e { background:#ff5470; }
    .table-wrap { background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:13.5px; min-width:760px; }
    th, td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
    th { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; }
    td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
    td.prompt { white-space:normal; min-width:220px; color:var(--muted); }
    tr:last-child td { border-bottom:0; }
    .pill { display:inline-block; padding:2px 9px; border-radius:99px; font-size:11.5px; font-weight:700; letter-spacing:.06em; }
    .HIT { background:rgba(62,230,208,.16); color:var(--teal); }
    .MISS { background:rgba(255,138,61,.16); color:var(--orange); }
    .ERR { background:rgba(255,84,112,.18); color:#ff8fa3; }
    .UNK { background:rgba(255,255,255,.1); color:var(--muted); }
    .empty { padding:28px; text-align:center; color:var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>BetterProxy <span>Cache Monitor</span></h1>
      <span class="meta" id="meta"></span>
      <span class="live" id="live">● live</span>
    </header>
    <div class="tiles" id="tiles"></div>
    <div class="bar" id="bar" title="hit / miss / error share"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Time</th><th>Cache</th><th class="num">First token</th><th class="num">Total</th><th class="num">Proxy latency</th><th class="num">Tokens charged</th><th class="num">Credits left</th><th>Prompt</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>No requests yet. Ask the chatbot something.</div>
    </div>
  </div>
  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const ms = (v) => v == null ? '–' : v.toLocaleString() + ' ms';
    const n = (v) => v == null ? '–' : v.toLocaleString();
    const usd = (v) => v == null ? '–' : '$' + v.toFixed(2);
    const tile = (k, v, s = '') => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;

    async function refresh() {
      try {
        const res = await fetch('/api/cache/stats' + location.search, { cache: 'no-store' });
        if (!res.ok) throw new Error((await res.json()).error || res.status);
        const { stats: s, recent } = await res.json();
        document.getElementById('meta').textContent = `${s.model} · ${s.baseUrl}`;
        document.getElementById('live').textContent = '● live';
        const speedup = s.avgHitMs && s.avgMissMs ? (s.avgMissMs / s.avgHitMs).toFixed(1) + '× faster on hit' : '';
        document.getElementById('tiles').innerHTML =
          tile('Requests', n(s.requests), `${n(s.errors)} errors`) +
          tile('Cache hit rate', s.hitRate == null ? '–' : Math.round(s.hitRate * 100) + '%', `${n(s.hits)} hit · ${n(s.misses)} miss` + (s.unknown ? ` · ${n(s.unknown)} unknown` : '')) +
          tile('Avg total · hit', ms(s.avgHitMs), `first token ${ms(s.avgHitTtfbMs)}`) +
          tile('Avg total · miss', ms(s.avgMissMs), speedup || `first token ${ms(s.avgMissTtfbMs)}`) +
          tile('Tokens charged', n(s.tokensCharged), `${n(s.tokensChargedOnHits)} on cache hits`) +
          tile('Credits left', usd(s.creditsRemaining), s.billingMode ? `billing: ${esc(s.billingMode)}` : '');
        const tot = s.requests || 1;
        document.getElementById('bar').innerHTML = `<i class="h" style="width:${s.hits / tot * 100}%"></i><i class="m" style="width:${s.misses / tot * 100}%"></i><i class="e" style="width:${s.errors / tot * 100}%"></i>`;
        document.getElementById('empty').hidden = recent.length > 0;
        document.getElementById('rows').innerHTML = recent.map((r) => {
          const c = r.error ? 'ERR' : r.cacheHit === true ? 'HIT' : r.cacheHit === false ? 'MISS' : 'UNK';
          const label = c === 'ERR' ? `ERR ${r.httpStatus ?? ''}` : c === 'UNK' ? (r.aborted ? 'STOPPED' : 'N/A') : c;
          return `<tr><td>${new Date(r.ts).toLocaleTimeString()}</td><td><span class="pill ${c}">${label}</span></td><td class="num">${ms(r.ttfbMs)}</td><td class="num">${ms(r.totalMs)}</td><td class="num">${ms(r.proxyLatencyMs)}</td><td class="num">${n(r.tokensCharged)}</td><td class="num">${usd(r.creditsRemaining)}</td><td class="prompt" title="${esc(r.error || '')}">${esc(r.promptPreview)}</td></tr>`;
        }).join('');
      } catch (e) {
        document.getElementById('live').textContent = '○ ' + e.message;
      }
    }
    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
